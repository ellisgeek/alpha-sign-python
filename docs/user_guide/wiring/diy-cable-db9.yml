# A home-made cable from the Sign to a USB-to-RS-232 adapter's 9-pin plug.
# The pins match Alpha's adapter (Networking Alpha Signs, 9700-0112C, p. 42);
# the wire colors match Alpha's cable (p. 35). Regenerate with `just wiring`.

options:
  fontname: Helvetica
  bgcolor: WH
  color_mode: full

connectors:
  Sign:
    image:
      src: faces/rj12-plug.svg
      caption: End view, latch down
      height: 84
      width: 120
    type: RJ12 plug (6P6C)
    subtype: male
    notes: to the Sign's jack
    pinlabels: [GND, RS-485 +, RXD (Sign in), TXD (Sign out), RS-485 −, +5 V (200 mA)]
  DB9:
    image:
      src: faces/db9-female.svg
      caption: Front view
      height: 84
      width: 144
    type: DB9
    subtype: female
    notes: to a USB-to-RS-232 adapter
    pinlabels: [DCD, RXD, TXD, DTR, GND, DSR, RTS, CTS, RI]
    hide_disconnected_pins: true

cables:
  Cable:
    notes: 3 wires; the library uses no handshake lines
    wirecount: 3
    colors: [BU, GN, RD]

connections:
  - - Sign: [1, 3, 4]
    - Cable: [1-3]
    - DB9: [5, 3, 2]
