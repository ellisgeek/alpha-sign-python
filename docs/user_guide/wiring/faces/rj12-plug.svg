<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140" viewBox="0 0 200 140" font-family="Helvetica, Arial, sans-serif">
  <!-- RJ12 (6P6C) plug, seen end on (the end that goes into the jack), latch down.
       It mirrors the jack, so pin 1 is on the right. Filled contacts: pins 1, 3, 4. -->
  <path d="M30 30 H170 V104 H30 Z" fill="#eef3f8" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M78 104 V126 H122 V104" fill="#eef3f8" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke-width="7" stroke-linecap="butt">
    <line x1="50" y1="32" x2="50" y2="50" stroke="#bbb"/>
    <line x1="70" y1="32" x2="70" y2="50" stroke="#bbb"/>
    <line x1="90" y1="32" x2="90" y2="50" stroke="#222"/>
    <line x1="110" y1="32" x2="110" y2="50" stroke="#222"/>
    <line x1="130" y1="32" x2="130" y2="50" stroke="#bbb"/>
    <line x1="150" y1="32" x2="150" y2="50" stroke="#222"/>
  </g>
  <g font-size="22" text-anchor="middle" fill="#222">
    <text x="50" y="22">6</text><text x="70" y="22">5</text><text x="90" y="22">4</text>
    <text x="110" y="22">3</text><text x="130" y="22">2</text><text x="150" y="22">1</text>
  </g>
</svg>
