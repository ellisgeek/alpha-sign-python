<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140" viewBox="0 0 200 140" font-family="Helvetica, Arial, sans-serif">
  <!-- RJ12 (6P6C) jack, seen from the front: latch slot down, pin 1 on the left.
       Filled contacts carry RS-232 (pins 1, 3, 4). TechMemo 02-0010A, p. 3. -->
  <rect x="10" y="22" width="180" height="110" rx="8" fill="#f2f2f2" stroke="#888" stroke-width="2"/>
  <path d="M30 36 H170 V104 H125 V122 H75 V104 H30 Z" fill="#fff" stroke="#222" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="50" y1="40" x2="50" y2="62" stroke="#222"/>
    <line x1="70" y1="40" x2="70" y2="62" stroke="#bbb"/>
    <line x1="90" y1="40" x2="90" y2="62" stroke="#222"/>
    <line x1="110" y1="40" x2="110" y2="62" stroke="#222"/>
    <line x1="130" y1="40" x2="130" y2="62" stroke="#bbb"/>
    <line x1="150" y1="40" x2="150" y2="62" stroke="#bbb"/>
  </g>
  <g font-size="22" text-anchor="middle" fill="#222">
    <text x="50" y="17">1</text><text x="70" y="17">2</text><text x="90" y="17">3</text>
    <text x="110" y="17">4</text><text x="130" y="17">5</text><text x="150" y="17">6</text>
  </g>
</svg>
