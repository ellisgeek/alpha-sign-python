name: Docs

# Builds the documentation site with great-docs (great-docs.yml) on every push
# and pull request, and publishes it to GitHub Pages from main. The repository's
# Pages source must be "GitHub Actions" (Settings > Pages).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for the pages' dates

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true

      # The docs group pins great-docs and Quarto (quarto-cli), as a local build uses.
      - run: uv sync --locked --group docs

      - run: just docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
