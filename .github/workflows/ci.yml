name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run prek run --all-files --show-diff-on-failure
      - run: uv run pytest

  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: emulator/.nvmrc
          cache: npm
          cache-dependency-path: emulator/package-lock.json
      - run: npm ci
        working-directory: emulator
      - run: npm run check
        working-directory: emulator
      - run: npm test
        working-directory: emulator
      - run: npm run build
        working-directory: emulator
      - run: npx playwright install --with-deps chromium
        working-directory: emulator
      - run: npm run test:page
        working-directory: emulator
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest -m emulator -rs
