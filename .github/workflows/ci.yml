name: CI

# Every tool comes from uv.lock: setup-uv activates the environment that
# `uv sync --locked` fills, so `just` and `prek` are the locked versions.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync --locked
      # The emulator's hooks need its npm packages; the emulator job checks it.
      - run: just check --show-diff-on-failure
        env:
          SKIP: emulator-biome,emulator-tsc
      - run: just coverage --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: coverage.xml
          flags: library-offline
          fail_ci_if_error: true

  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: emulator/.nvmrc
          cache: npm
          cache-dependency-path: emulator/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync --locked
      - run: just emu-install
      - run: just emu-check
      - run: just emu-coverage
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: emulator/coverage/lcov.info
          flags: emulator
          fail_ci_if_error: true
      - run: just emu-build
      - run: just emu-install-browser --with-deps
      - run: just emu-test-page
      - run: just test-emulator -rs --cov --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: coverage.xml
          flags: library-emulator
          fail_ci_if_error: true
