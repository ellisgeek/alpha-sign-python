name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      # The emulator's hooks need its npm packages; the emulator job checks it.
      - uses: j178/prek-action@v3.1.0
        env:
          SKIP: emulator-biome,emulator-tsc
      - run: just test

  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: emulator/.nvmrc
          cache: npm
          cache-dependency-path: emulator/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just emu-install
      - run: just emu-check
      - run: just emu-test
      - run: just emu-build
      - run: just emu-install-browser --with-deps
      - run: just emu-test-page
      - run: just test-emulator -rs
