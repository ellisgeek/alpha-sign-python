name: CI

# Every tool comes from uv.lock: setup-uv activates the environment that
# `uv sync --locked` fills, so `just` and `prek` are the locked versions.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov uploads (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync --locked
      # The emulator's hooks need its npm packages; the emulator job checks it.
      - run: just check --show-diff-on-failure
        env:
          SKIP: emulator-biome,emulator-tsc
      - run: just coverage --cov-report=xml --junitxml=reports/library-offline.xml
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: coverage.xml
          flags: library-offline
          fail_ci_if_error: true
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && hashFiles('reports/library-offline.xml') != '' }}
        with:
          use_oidc: true
          disable_search: true
          report_type: test_results
          files: reports/library-offline.xml
          flags: library-offline
          fail_ci_if_error: true

  emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov uploads (OIDC)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: emulator/.nvmrc
          cache: npm
          cache-dependency-path: emulator/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync --locked
      - run: just emu-install
      - run: just emu-check
      - run: just emu-coverage --reporter=default --reporter=junit --outputFile.junit=../reports/emulator.xml
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: emulator/coverage/lcov.info
          flags: emulator
          fail_ci_if_error: true
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && hashFiles('reports/emulator.xml') != '' }}
        with:
          use_oidc: true
          disable_search: true
          report_type: test_results
          files: reports/emulator.xml
          flags: emulator
          fail_ci_if_error: true
      - run: just emu-build
      - run: just emu-install-browser --with-deps
      - run: just emu-test-page --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/reports/emulator-page.xml
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && hashFiles('reports/emulator-page.xml') != '' }}
        with:
          use_oidc: true
          disable_search: true
          report_type: test_results
          files: reports/emulator-page.xml
          flags: emulator-page
          fail_ci_if_error: true
      - run: just test-emulator -rs --cov --cov-report=xml --junitxml=reports/library-emulator.xml
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          disable_search: true
          files: coverage.xml
          flags: library-emulator
          fail_ci_if_error: true
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && hashFiles('reports/library-emulator.xml') != '' }}
        with:
          use_oidc: true
          disable_search: true
          report_type: test_results
          files: reports/library-emulator.xml
          flags: library-emulator
          fail_ci_if_error: true
