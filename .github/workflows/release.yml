name: Release

# Publishes a release when a SemVer tag is pushed. Cut the release locally
# first with `just release` (bump, changelog, commit, tag), then push the
# commit and the tag. The build job checks and builds; the files go to PyPI
# (trusted publishing, the "pypi" environment) and then to a GitHub release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for git-cliff

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true

      - name: Check tag matches the package version
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$tag' is not SemVer MAJOR.MINOR.PATCH (e.g. 0.1.0)"
            exit 1
          fi
          version="$(uv version --short)"
          if [[ "$version" != "$tag" ]]; then
            echo "::error::Tag '$tag' does not match pyproject.toml version '$version'; cut releases with just release"
            exit 1
          fi

      - run: uv sync --locked

      # The emulator's hooks need its npm packages; CI checks the emulator.
      - run: just check --show-diff-on-failure
        env:
          SKIP: emulator-biome,emulator-tsc

      - run: just test -q

      - run: just build

      - run: just release-notes > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/alpha-led-sign/${{ github.ref_name }}/
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true

      - run: uv sync --locked

      - uses: actions/download-artifact@v8
        with:
          name: release

      - run: just publish

  github:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
