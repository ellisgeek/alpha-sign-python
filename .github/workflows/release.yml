name: Release

# Publishes a GitHub release when a SemVer tag is pushed. Cut the release
# locally first with `just release` (bump, changelog, commit, tag), then
# push the commit and the tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for git-cliff

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: extractions/setup-just@v4

      - name: Check tag matches the package version
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$tag' is not SemVer MAJOR.MINOR.PATCH (e.g. 0.1.0)"
            exit 1
          fi
          version="$(uv version --short)"
          if [[ "$version" != "$tag" ]]; then
            echo "::error::Tag '$tag' does not match pyproject.toml version '$version'; cut releases with just release"
            exit 1
          fi

      # The emulator's hooks need its npm packages; CI checks the emulator.
      - uses: j178/prek-action@v3.1.0
        env:
          SKIP: emulator-biome,emulator-tsc

      - run: just test -q

      - name: Release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: pyproject.toml
          args: --current --strip all
        env:
          OUTPUT: ${{ runner.temp }}/notes.md

      - run: just build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
